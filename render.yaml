databases:
  - name: death-radar-db
    databaseName: deathradar
    user: deathradar
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: death-radar-aurera
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: death-radar-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GUILD_ALLY
        value: Chora pra Warning
      - key: GUILD_ENEMY
        value: Vanguard
      - key: DEATHS_URL
        value: https://telaria.aurera-global.com/?view=ultimas_mortes
      - key: POLL_INTERVAL_SECONDS
        value: "30"
